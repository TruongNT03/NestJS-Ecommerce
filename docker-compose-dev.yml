version: '3.0'

services:
  database:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5433:5432
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8.0-rc1-alpine
    container_name: redis
    ports:
      - 6378:6379
volumes:
  postgres_data:
