version: '3.9'

services:
  app:
    build: .
    container_name: nestjs_app
    env_file:
      - .env.production
    ports:
      - 8080:8080
    depends_on:
      - database
      - redis

  database:
    image: postgres:15
    container_name: postgres
    env_file:
      - .env.production
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8.0-rc1-alpine
    container_name: redis
    ports:
      - 6378:6379
  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
