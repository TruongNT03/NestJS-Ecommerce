version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs_app
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - '8080'
    depends_on:
      - redis
      - database
    networks:
      - web

  database:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web

  redis:
    image: redis:8.0-rc1-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - '6378:6379'
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - web
    command: 'nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "
      trap exit TERM; 
      while :; do 
        certbot certonly --webroot -w /var/www/certbot -d api.teeshop.io.vn --email youremail@example.com --agree-tos --non-interactive;
        sleep 12h & wait $${!};
      done"
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  postgres_data:
